name: Android release

on:
  push:
    branches: [main, offline-android-release, android-roadmap-corrections]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  release:
    name: Android offline release
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Android source
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Enable pnpm
        run: |
          corepack enable
          corepack prepare pnpm@10.4.1 --activate

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Build web assets and prepare hybrid Android assets
        env:
          FUTMANAGER_DATA_MANIFEST_URL: https://github.com/Kyra2214/FutManager-data/releases/download/v1.0.0/manifest.json
        run: pnpm android:sync

      - name: Assemble release APK
        working-directory: android
        run: ./gradlew --no-daemon assembleRelease

      - name: Validate hybrid APK contract
        run: python3 scripts/validate-android-apk.py android/app/build/outputs/apk/release/app-release.apk

      - name: Validate remote data package
        run: |
          curl --fail --location --silent --show-error \
            https://github.com/Kyra2214/FutManager-data/releases/download/v1.0.0/manifest.json \
            --output "$RUNNER_TEMP/futmanager-manifest.json"
          curl --fail --location --silent --show-error \
            https://github.com/Kyra2214/FutManager-data/releases/download/v1.0.0/futmanager-data-v1.0.0.zip \
            --output "$RUNNER_TEMP/futmanager-data.zip"
          python3 scripts/validate-data-package.py \
            "$RUNNER_TEMP/futmanager-data.zip" \
            "$RUNNER_TEMP/futmanager-manifest.json"

      - name: Upload release APK
        uses: actions/upload-artifact@v4
        with:
          name: futmanager-android-release
          path: android/app/build/outputs/apk/release/app-release.apk
          if-no-files-found: error
